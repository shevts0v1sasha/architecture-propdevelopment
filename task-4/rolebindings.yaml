apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-group-binding
  namespace: development
subjects:
  - kind: Group
    name: qa
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: managers
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: analytics
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edit-group-binding
  namespace: development
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: edit
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-group-binding
  namespace: development
subjects:
  - kind: Group
    name: devops
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: admin
  apiGroup: rbac.authorization.k8s.io
